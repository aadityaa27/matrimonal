version: '3.8'

services:
  # ==========================================
  # 1. MySQL 8 Database Service
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: bandhan-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_123
      MYSQL_DATABASE: bandhan_db
      MYSQL_USER: bandhan
      MYSQL_PASSWORD: bandhan123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "bandhan", "-pbandhan123"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ==========================================
  # 2. Express Backend API Service
  # ==========================================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: bandhan-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: bandhan
      DB_PASSWORD: bandhan123
      DB_NAME: bandhan_db
      JWT_SECRET: bandhan_super_secret_jwt_key_qa_demo_2026
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy

  # ==========================================
  # 3. Vite React Frontend Service
  # ==========================================
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: bandhan-frontend
    restart: always
    environment:
      VITE_API_URL: http://localhost:5000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mysql_data:
    driver: local
